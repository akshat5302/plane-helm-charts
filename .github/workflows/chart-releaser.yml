name: Chart Release

on:
  workflow_dispatch: 
    inputs:
      plane-ce:
        description: 'Build Plane CE'
        type: boolean
        default: false
      plane-ee:
        description: 'Build Plane EE'
        type: boolean
        default: false

env:
  CR_CONFIGFILE: "${{ github.workspace }}/cr.yaml"
  CR_TOOL_PATH: "${{ github.workspace }}/.cr-tool"
  CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GNUPGHOME: ${{ github.workspace }}/.gnupg
  GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  TARGET_BRANCH: "${{ github.ref_name }}"
  CHART_NAME_CE: "plane-ce"
  CHART_NAME_ENTERPRISE: "plane-enterprise"
  MARK_AS_LATEST: true
  MARK_AS_PRERELASE: false
  PAGES_INDEX_PATH: ""

jobs:
  setup:
    if: ${{ github.event.inputs.plane-ce == 'true' || github.event.inputs.plane-ee == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Prepare GPG key #this step is for using exported keys and make your github runner
        env:
          CR_PASSPHRASE_FILE: ${{env.GNUPGHOME}}/gpg-passphrase
        run: |
          gpg --version
          
          mkdir -p ${{env.GNUPGHOME}}
          chmod 700 ${{env.GNUPGHOME}}

          # Disable the use of the gpg-agent
          echo "use-agent" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "pinentry-mode loopback" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "no-tty" >> ${{env.GNUPGHOME}}/gpg.conf
          echo "no-autostart" >> ${{env.GNUPGHOME}}/gpg-agent.conf
          echo "allow-loopback-pinentry" >> ${{env.GNUPGHOME}}/gpg-agent.conf
          echo "${{env.GPG_PASSPHRASE}}" > ${{env.CR_PASSPHRASE_FILE}}
          
          # Import the GPG key
          echo "${{ env.GPG_PRIVATE_KEY }}" | gpg --batch --yes --pinentry-mode loopback --passphrase ${{ env.GPG_PASSPHRASE }} --import

          # Re-create keyring in legacy format for Helm compatibility
          gpg --export-secret-keys --passphrase ${{env.GPG_PASSPHRASE}} > ${{env.GNUPGHOME}}/secring.gpg
          gpg --export --passphrase ${{env.GPG_PASSPHRASE}} > ${{env.GNUPGHOME}}/pubring.gpg

          chmod 400 ${{env.GNUPGHOME}}/secring.gpg

      - name: Remove unwanted charts
        run: |
          if [ "${{ github.event.inputs.plane-ce }}" = "false" ]; then
            rm -rf charts/${{ env.CHART_NAME_CE }}
          fi
          if [ "${{ github.event.inputs.plane-ee }}" = "false" ]; then
            rm -rf charts/${{ env.CHART_NAME_ENTERPRISE }}
          fi

      - name: Rename Chart
        if: github.ref_name != 'master'
        run: |
          flatBranchName=$(echo "${{ env.TARGET_BRANCH }}" | sed 's/\//\-/g')
          if [ "${{ github.event.inputs.plane-ce }}" = "true" ]; then
            sed -i "s/name: \(.*\)/name: \1-${flatBranchName}/" charts/${{ env.CHART_NAME_CE }}/Chart.yaml
          fi

          if [ "${{ github.event.inputs.plane-ee }}" = "true" ]; then
            sed -i "s/name: \(.*\)/name: \1-${flatBranchName}/" charts/${{ env.CHART_NAME_ENTERPRISE }}/Chart.yaml
          fi

          echo "MARK_AS_LATEST=false" >> $GITHUB_ENV
          echo "MARK_AS_PRERELASE=true" >> $GITHUB_ENV
          echo "PAGES_INDEX_PATH=${flatBranchName}" >> $GITHUB_ENV

      - name: Release Charts
        uses: mguptahub/chart-releaser-action@v1.6.2
        with:
          charts_dir: charts
          config: cr.yaml
          packages_with_index: false
          skip_existing: true
          mark_as_latest: ${{ env.MARK_AS_LATEST }}
          prerelease: ${{ env.MARK_AS_PRERELASE }}
          pages_index_path: ${{ env.PAGES_INDEX_PATH }}
        env:
          CR_TOKEN: ${{ env.CR_TOKEN }}
          CR_KEY: ${{ env.GPG_KEY_NAME }}
          CR_KEYRING: ${{env.GNUPGHOME}}/secring.gpg
          CR_PASSPHRASE_FILE: ${{env.GNUPGHOME}}/gpg-passphrase
          CR_SIGN: true

  publish:
    if: ${{ github.ref_name == 'master' }}
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: code

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gh-pages
          path: pages

      - name: Configure Git
        working-directory: pages
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Copy Readme
        run: |
          if [ "${{ github.event.inputs.plane-ce }}" = "true" ]; then
            cp code/charts/plane-ce/README.md pages/content/plane-ce.md
          fi
          if [ "${{ github.event.inputs.plane-ee }}" = "true" ]; then
            cp code/charts/plane-enterprise/README.md pages/content/plane-ee.md
          fi

      - name: Publish pages
        working-directory: pages
        run: |
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            # Commit and push the changes
            git commit -m "Updated READMEs"
            git push
          fi

      - name: Collect released charts info
        id: collect
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_CHANNEL not set, skipping notification"
            exit 0
          fi
          set -e
          git fetch origin --tags 2>/dev/null || true

          SUMMARY_FILE="${{ github.workspace }}/release-summary.txt"
          echo "*Helm Chart Release*" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          for chart_dir in charts/*/; do
              [ -f "${chart_dir}Chart.yaml" ] || continue
              name=$(grep '^name:' "${chart_dir}Chart.yaml" | sed 's/^name:[[:space:]]*//' | tr -d '\r')
              version=$(grep '^version:' "${chart_dir}Chart.yaml" | sed 's/^version:[[:space:]]*//' | tr -d '\r')
              current_tag="${name}-${version}"

              echo "*${name}* \`${version}\`" >> "$SUMMARY_FILE"

              all_tags=$(git tag -l "${name}-*" 2>/dev/null | sort -V || true)
              prev_tag=$(echo "$all_tags" | grep -F "${current_tag}" -B 1 | head -1 || true)

              if [ -n "$prev_tag" ] && [ "$prev_tag" != "$current_tag" ]; then
                commit_lines=$(gh api "repos/${{ github.repository }}/compare/${prev_tag}...${current_tag}" --jq '.commits[] | .commit.message | split("\n")[0]' -r 2>/dev/null || true)
                if [ -n "$commit_lines" ]; then
                  echo "$commit_lines" | while IFS= read -r msg; do [ -n "$msg" ] && echo "  • $msg" >> "$SUMMARY_FILE"; done
                else
                  echo "  • (no commits)" >> "$SUMMARY_FILE"
                fi
              else
                echo "  • (first release or no previous tag)" >> "$SUMMARY_FILE"
              fi
              echo "" >> "$SUMMARY_FILE"
            done
  
      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "SLACK_BOT_TOKEN or SLACK_CHANNEL not set, skipping notification"
            exit 0
          fi

          SUMMARY_FILE="${{ github.workspace }}/release-summary.txt"
          [ -f "$SUMMARY_FILE" ] || { echo "No release summary found"; exit 0; }

          # Build Block Kit payload with proper JSON escaping of summary text
          SUMMARY_ESCAPED=$(jq -Rs . < "$SUMMARY_FILE")
          WORKFLOW_LINK="<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --argjson text "$SUMMARY_ESCAPED" \
            --arg link "$WORKFLOW_LINK" \
            '{
              channel: $channel,
              text: "Helm Chart Release",
              blocks: [
                { type: "header", text: { type: "plain_text", text: "Helm Chart Release", emoji: true } },
                { type: "section", text: { type: "mrkdwn", text: $text } },
                { type: "context", elements: [{ type: "mrkdwn", text: $link }] }
              ]
            }')

          HTTP_CODE=$(curl -s -o /tmp/slack_response.json -w "%{http_code}" -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Slack API returned HTTP $HTTP_CODE"
            cat /tmp/slack_response.json
            exit 1
          fi
          if grep -q '"ok":\s*false' /tmp/slack_response.json 2>/dev/null; then
            echo "Slack API returned error:"
            cat /tmp/slack_response.json
            exit 1
          fi
          echo "Slack notification sent successfully."
  

